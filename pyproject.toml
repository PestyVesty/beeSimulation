[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bee-polytunnel-simulation"
version = "0.1.0"
description = "Agent-based simulation of bee foraging in a polytunnel"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mesa>=3.0,<4",
    "networkx>=3.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "shapely>=2.0",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=6",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]
test = ["pytest>=8"]

[project.scripts]
bee-simulation = "bee_simulation.run:main"

[tool.setuptools.packages.find]
include = ["bee_simulation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
